name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: preagent-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Verify version tag and Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to crate version and locked version
        run: node scripts/release-check.cjs tag "$GITHUB_REF_NAME"

  build:
    name: Build (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify release tag
        run: node scripts/release-check.cjs tag "$GITHUB_REF_NAME"
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Build
        run: cargo build --release --locked
      - name: Smoke-test the native executable
        shell: bash
        run: |
          exe="preagent"
          if [[ "$RUNNER_OS" == 'Windows' ]]; then exe='preagent.exe'; fi
          "./target/release/$exe" --help >/dev/null
          "./target/release/$exe" doctor --json >/dev/null
          actual=$("./target/release/$exe" --version)
          if [[ "$actual" != "preagent ${GITHUB_REF_NAME#v}" ]]; then
            echo "wrong binary version: $actual" >&2
            exit 1
          fi
      - name: Package and verify checksum
        shell: bash
        run: |
          mkdir -p dist
          archive="preagent-${GITHUB_REF_NAME}-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          exe="preagent"
          if [[ "$RUNNER_OS" == 'Windows' ]]; then exe='preagent.exe'; fi
          tar -czf "dist/$archive" -C target/release "$exe"
          (cd dist && if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
            sha256sum -c "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
            shasum -a 256 -c "$archive.sha256"
          fi)
          tar -tzf "dist/$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: preagent-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish verified release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: preagent-*
          path: dist
          merge-multiple: true
      - name: Verify complete Linux, Windows and macOS artifacts
        run: node scripts/release-check.cjs assets dist "$GITHUB_REF_NAME"
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
