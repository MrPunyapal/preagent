name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Evaluate routing smoke corpus
        run: cargo run --locked -- eval --json
      - name: Validate frozen held-out task manifest
        run: cargo run --locked -- heldout list --json
      - name: Evaluate frozen held-out routing (no SLM)
        run: cargo run --locked -- heldout route --json
      - name: Verify v2 pinned dependency snapshots
        run: node evals/heldout/v2/locks/lock-snapshots.cjs check
      - name: Validate held-out v2 candidates (not frozen)
        run: node evals/heldout/v2/check.cjs draft
      - name: Test held-out v2 freeze gates
        run: node --test evals/heldout/v2/check.test.cjs
      - name: Check held-out v2 license-inventory test helpers
        run: node --test evals/heldout/v2/license-inventory.test.cjs
      - name: Test selective v2 fixture controls
        run: node --test evals/heldout/v2/select-controls.test.cjs
      - name: Test isolated v2 candidate grader
        run: node --test evals/heldout/v2/grade.test.cjs
      - name: Validate held-out v2 reviewer submission schema
        run: node --test evals/heldout/v2/review/check-submission.test.cjs
      - name: Build
        run: cargo build --release --locked
      - name: Upload development binary
        uses: actions/upload-artifact@v4
        with:
          name: preagent-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/preagent
            target/release/preagent.exe
          if-no-files-found: error
