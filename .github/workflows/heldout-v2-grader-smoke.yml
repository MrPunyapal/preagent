name: Held-out v2 isolated grader smoke

on:
  push:
    paths:
      - '.github/workflows/heldout-v2-grader-smoke.yml'
      - 'evals/heldout/v2/grade.cjs'
      - 'evals/heldout/v2/grade-smoke.cjs'
      - 'evals/heldout/v2/candidates.json'
      - 'evals/heldout/v2/locks/catalog.json'
      - 'evals/heldout/v2/locks/serde.lock'
      - 'evals/heldout/v2/seeds/serde-numeric-range.patch'
      - 'evals/heldout/v2/acceptance/serde-numeric-range.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serde-grader:
    name: Verify isolated clean and seeded grading
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Grade controlled Serde fixture without changing candidate
        run: node evals/heldout/v2/grade-smoke.cjs
