name: Held-out v2 candidate controls

on:
  push:
    paths:
      - '.github/workflows/heldout-v2-controls.yml'
      - 'evals/heldout/v2/**'

permissions:
  contents: read

jobs:
  select:
    name: Select changed v2 controls
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
      has_tasks: ${{ steps.select.outputs.has_tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        name: Discover affected fixtures
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node evals/heldout/v2/select-controls.cjs ci

  controlled:
    name: Verify seed (${{ matrix.task }})
    needs: select
    if: needs.select.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.select.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run pinned green/red acceptance controls
        run: node evals/heldout/v2/control-runner.cjs ${{ matrix.task }}
      - name: Preserve raw control results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-controls-${{ matrix.task }}
          path: target/validation/v2-controls/${{ matrix.task }}.json
          if-no-files-found: warn
